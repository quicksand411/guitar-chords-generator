<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Chord Progression Generator | Point Prime Recordings</title>
    
    <script data-noptimize="1" data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script data-noptimize="1" data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script data-noptimize="1" data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script data-noptimize="1" data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
    
    <script data-noptimize="1" data-cfasync="false">
        tailwind.config = {
            important: '#chord-app-container',
            corePlugins: { preflight: false }
        }
    </script>
    
    <style>
        #chord-app-container {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            color: #e8e6e1;
            width: 100%;
            min-height: 100vh;
            background-color: #0d0d0d;
            position: relative;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow-y: auto;
        }
        #chord-app-container .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
        #chord-app-container select { appearance: none; -webkit-appearance: none; -moz-appearance: none; }
        #chord-app-container input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
        #chord-app-container input[type="range"]::-webkit-slider-runnable-track {
            height: 2px; background: #2a2a2a;
        }
        #chord-app-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; margin-top: -7px; width: 16px; height: 16px;
            background: #ffb454; border-radius: 2px; box-shadow: 0 0 8px rgba(255,180,84,0.6);
        }
        #chord-app-container ::-webkit-scrollbar { width: 8px; height: 8px; }
        #chord-app-container ::-webkit-scrollbar-track { background: #0d0d0d; }
        #chord-app-container ::-webkit-scrollbar-thumb { background: #2a2a2a; }
        #chord-app-container *:focus-visible { outline: 2px solid #ffb454; outline-offset: 2px; }
    </style>
</head>
<body style="margin:0; background:#0d0d0d;">

    <div id="chord-app-container">
        <div id="root"></div>
    </div>

    <script type="text/babel" data-type="module" data-noptimize="1" data-cfasync="false" src="./src/main.jsx"></script>
</body>
</html>
