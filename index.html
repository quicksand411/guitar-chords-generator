<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Chord Progression Generator | Point Prime Recordings</title>
    
    <!-- Только Tailwind CDN, React и Babel теперь устанавливаются через package.json -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            important: '#chord-app-container',
            corePlugins: { preflight: false }
        }
    </script>
    
    <style>
        body { margin: 0; background: #0d0d0d; }
        
        #chord-app-container {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            color: #e8e6e1;
            width: 100%;
            /* min-height 100vh исправит проблему с обрезанием приложения (скрыта половина экрана) */
            min-height: 100vh;
            background-color: #0d0d0d;
            position: relative;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow-y: auto;
        }
        #chord-app-container .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
        #chord-app-container select { appearance: none; -webkit-appearance: none; -moz-appearance: none; }
        #chord-app-container input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
        #chord-app-container input[type="range"]::-webkit-slider-runnable-track {
            height: 2px; background: #2a2a2a;
        }
        #chord-app-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; margin-top: -7px; width: 16px; height: 16px;
            background: #ffb454; border-radius: 2px; box-shadow: 0 0 8px rgba(255,180,84,0.6);
            cursor: pointer;
        }
        #chord-app-container ::-webkit-scrollbar { width: 8px; height: 8px; }
        #chord-app-container ::-webkit-scrollbar-track { background: #0d0d0d; }
        #chord-app-container ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
        #chord-app-container *:focus-visible { outline: 2px solid #ffb454; outline-offset: 2px; }
    </style>
</head>
<body>

    <div id="chord-app-container">
        <div id="root"></div>
    </div>

    <!-- ВАЖНО: Правильный тег для Vite (никакого text/babel) -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
