<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Chord Progression Generator | Point Prime Recordings</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind via CDN (Simplifies the project) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
          },
        },
      }
    </script>

    <!-- Global Styles -->
    <style>
      body {
        margin: 0;
        background-color: #0d0d0d;
        color: #e8e6e1;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      select { appearance: none; -webkit-appearance: none; -moz-appearance: none; }
      input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
      input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: #2a2a2a; }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; margin-top: -7px; width: 16px; height: 16px;
        background: #ffb454; border-radius: 2px; box-shadow: 0 0 8px rgba(255,180,84,0.6); cursor: pointer;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0d0d0d; }
      ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
      *:focus-visible { outline: 2px solid #ffb454; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
